name: Secret scan

# Dedicated secret scanner over the full fetched history and the working tree (issue #8).
# Allowlisted test sentinels are reviewed in .gitleaks.toml. Findings are redacted in the log and
# no report artifact is uploaded. Scope and limits: docs/release-checklist.md.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bump both together after checking the release's checksums.txt from github.com/gitleaks/gitleaks.
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' # linux_x64.tar.gz

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit on all fetched branches and tags, not only the tip
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan all fetched revisions
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
      - name: Scan the checked-out working tree
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
