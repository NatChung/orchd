name: Desktop round trip

# Dedicated authenticated desktop. Never run untrusted pull request code here.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: orchd-desktop-roundtrip
  cancel-in-progress: false

jobs:
  desktop:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || vars.ORCHD_DESKTOP_E2E_ENABLED == 'true')
    runs-on: [self-hosted, macOS, orchd-desktop-e2e]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install candidate and verify live Desktop round trip
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -z "${ORCHD_DESKTOP_E2E_DRIVER:-}" ]; then
            echo "Automatic Desktop smoke requires ORCHD_DESKTOP_E2E_DRIVER" >&2
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/orchd-desktop-e2e-venv"
          "$RUNNER_TEMP/orchd-desktop-e2e-venv/bin/python" -m pip install .
          "$RUNNER_TEMP/orchd-desktop-e2e-venv/bin/python" scripts/desktop_roundtrip.py
