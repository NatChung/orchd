# Orch 的鎖：只能讀寫 Orch 家（$ORCH_HOME），不碰任何專案 repo。由 `orchd init` 產生。
# 派工工具：orchd MCP。
# 個人要額外開放讀取的路徑與要關掉的 app，寫在 ~/.config/orchd/init.toml（見 README），不寫在這個範本。
default_permissions = "orch"
approval_policy = "never"

[features]
network_proxy = false
plugins = false
multi_agent = false

[permissions.orch.filesystem]
":minimal" = "read"
$HOME_PATH = "deny"
$LOCAL_BIN_PATH = "read"
$CODEX_STANDALONE_PATH = "read"
$PLATFORM_READS$EXTRA_READ$ORCH_HOME_PATH = "write"
$ORCH_CONFIG_PATH = "read"

[permissions.orch.network]
enabled = false
$DISABLED_APPS
[mcp_servers.orchd]
command = $ORCHD_COMMAND
args = [${ORCHD_LEAD}"mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 180
$WINDOWS_SANDBOX
